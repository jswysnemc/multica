[workspace]
default_root = "/path/to/project"

[editing]
patch_only = true
protect_user_changes = true
allow_destructive_git = false

[search]
semantic_first = true
fallback_exact_search = true
external_docs_official_first = true

[verification]
run_focused_tests_first = true
run_full_check_before_submit = true

[privacy]
redact_secrets = true
omit_generated_attribution = true
