# 来源：$HOME/.codex/config.toml
# 脱敏说明：
# - 私有项目路径只保留类别和当前笔试仓库路径。
# - API 代理地址、MCP token、搜索 API key、Authorization header 已脱敏。
# - auth.json、history.jsonl、sqlite 日志未纳入交付。

model_provider = "OpenAI"
model = "gpt-5.5"
model_instructions_file = "~/.codex/prompts/system-prompt.md"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
model_context_window = 272000
disable_response_storage = true
network_access = "enabled"
model_auto_compact_token_limit = 272000

approval_policy = "never"
sandbox_mode = "danger-full-access"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "git-branch", "current-dir"]

[trusted_projects.summary]
total = "80+"
categories = [
  "$HOME/workspace/*",
  "$HOME/Desktop/*",
  "$HOME/.claude/skills/*",
  "$HOME/.config/*",
  "$HOME/Downloads/*",
  "/tmp",
  "current_exam_repo"
]

[projects."$HOME/workspace/writeen_exam/test1/multica"]
trust_level = "trusted"

[notice]
fast_default_opt_out = true

[marketplaces.openai-primary-runtime]
last_updated = "2026-05-21T14:23:45Z"
source_type = "local"
source = "$HOME/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

